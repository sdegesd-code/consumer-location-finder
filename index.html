<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location & DTR Tracker - GESD</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary: #0f4c81;
            --primary-hover: #083358;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 12px; }

        .hidden { display: none !important; }

        /* Install Banner */
        #installAppBtn { width: 100%; max-width: 480px; padding: 14px; background-color: #10b981; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 15px; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }

        .app-card { background: var(--card-bg); width: 100%; max-width: 480px; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); padding: 28px 24px; border: 1px solid #f1f5f9; position: relative; }
        
        .brand-header { text-align: center; margin-bottom: 24px; }
        .brand-logo { height: 65px; width: auto; object-fit: contain; margin-bottom: 12px; }
        .brand-header h1 { font-size: 20px; font-weight: 700; color: var(--primary); }
        .brand-header p { font-size: 13px; color: var(--text-muted); font-weight: 500; }

        /* Mode Switcher */
        .mode-toggle { display: flex; background: #f1f5f9; border-radius: 10px; margin-bottom: 20px; overflow: hidden; }
        .mode-btn { flex: 1; padding: 10px; text-align: center; font-size: 13px; font-weight: 600; cursor: pointer; color: #64748b; transition: 0.2s; }
        .mode-btn.active { background: var(--primary); color: white; }

        /* Inputs */
        .styled-input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1.5px solid #e2e8f0; font-size: 16px; outline: none; transition: all 0.2s ease; background: #fafafa; margin-bottom: 12px; }
        .styled-input:focus { border-color: var(--primary); background: #ffffff; box-shadow: 0 0 0 4px rgba(15, 76, 129, 0.1); }
        textarea.styled-input { resize: vertical; min-height: 120px; font-family: monospace; font-size: 14px; }
        
        .btn-primary { width: 100%; padding: 14px; border-radius: 12px; border: none; background-color: var(--primary); color: white; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(15, 76, 129, 0.25); }
        .btn-primary:hover:not(:disabled) { background-color: var(--primary-hover); }
        .btn-primary:disabled { background-color: #cbd5e1; cursor: not-allowed; box-shadow: none; }
        .btn-success { background-color: #10b981; }

        .status-badge { text-align: center; font-size: 12px; font-weight: 600; color: var(--text-muted); padding: 6px 12px; border-radius: 20px; background: #f1f5f9; width: fit-content; margin: 0 auto; }
        
        .results-section { margin-top: 24px; display: none; }
        .consumer-chip { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; font-family: monospace; font-size: 16px; font-weight: 700; text-align: center; padding: 10px; border-radius: 10px; margin-bottom: 18px; }
        
        /* TABS UI */
        .tabs-container { display: flex; border-bottom: 2px solid #e2e8f0; margin-bottom: 16px; }
        .tab { flex: 1; text-align: center; padding: 10px 5px; font-size: 13px; font-weight: 700; color: #94a3b8; cursor: pointer; border-bottom: 3px solid transparent; transition: 0.2s; }
        .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* DTR Cards */
        .location-group { border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; background: #fafafa; }
        .map-card { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; text-decoration: none; color: white; font-size: 14px; font-weight: 600; }
        
        .card-smart { background: linear-gradient(135deg, #10b981, #059669); }
        .card-arms { background: linear-gradient(135deg, #0284c7, #0369a1); }
        .card-prepaid { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
        
        .dtr-list { padding: 12px 16px; }
        .dtr-header { font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
        .dtr-item { padding: 12px 0; border-bottom: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 6px; }
        .dtr-item:last-child { border-bottom: none; padding-bottom: 4px; }
        .dtr-main-row { display: flex; justify-content: space-between; align-items: center; }
        .dtr-name { font-weight: 700; color: #1e293b; font-size: 14px; }
        .dtr-dist { font-weight: 700; color: #ef4444; font-family: monospace; font-size: 14px; background: #fee2e2; padding: 2px 6px; border-radius: 6px; }
        .dtr-details { font-size: 12px; color: #475569; line-height: 1.5; }
        .dtr-details span.label { font-weight: 600; color: #1e293b; }
        .dtr-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; padding-top: 8px; border-top: 1px dashed #cbd5e1; font-size: 12px; }
        .consumer-val { font-weight: 700; color: #1e293b; font-size: 13px; }

        .badge-missing { background: #f1f5f9; color: #94a3b8; font-size: 13px; padding: 20px; border-radius: 12px; text-align: center; border: 1px dashed #cbd5e1; font-weight: 600; }
        .error-card { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 14px; border-radius: 12px; text-align: center; font-size: 14px; font-weight: 600; }

        #loginError { color: #dc2626; font-size: 13px; text-align: center; margin-top: 10px; display: none; font-weight: 600; }
        #mainApp { display: none; }
    </style>
</head>
<body>

<button id="installAppBtn" class="hidden">📲 Install App to Home Screen</button>

<!-- LOGIN SCREEN -->
<div class="app-card" id="loginScreen">
    <div class="brand-header">
        <img src="logo.png" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
        <h1>Authorized Access</h1>
        <p>Goalpara ESD Location Tracker</p>
    </div>
    <input type="password" id="passInput" class="styled-input" placeholder="Enter Access PIN" autocomplete="off">
    <button id="loginBtn" class="btn-primary">Unlock App</button>
    <div id="loginError">❌ Incorrect PIN. Please try again.</div>
</div>

<!-- MAIN APP SCREEN -->
<div class="app-card" id="mainApp">
    <div class="brand-header">
        <img src="logo.png" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
        <h1>Location & DTR Tracker</h1>
        <button id="logoutBtn" style="background:none; border:none; color:var(--text-muted); text-decoration:underline; cursor:pointer; font-size:12px; margin-top:5px;">Lock App</button>
    </div>

    <!-- Mode Toggle -->
    <div class="mode-toggle">
        <div class="mode-btn active" id="btnSingleMode">Single Search</div>
        <div class="mode-btn" id="btnBatchMode">Batch Process</div>
    </div>

    <!-- SINGLE SEARCH MODE -->
    <div id="modeSingle">
        <div style="margin-bottom: 16px;">
            <label style="font-size: 13px; font-weight: 600; margin-bottom: 6px; display:block;">Consumer No. (Last 5 Digits)</label>
            <input type="number" id="shortInput" class="styled-input" placeholder="e.g. 72136" autocomplete="off">
            <button id="searchBtn" class="btn-primary" disabled>Search Location</button>
        </div>

        <div id="resultsArea" class="results-section">
            <div class="consumer-chip" id="displayFullNumber"></div>
            
            <!-- TABS -->
            <div class="tabs-container">
                <div class="tab" data-target="tab-smart">Smart Meter</div>
                <div class="tab" data-target="tab-arms">ARMS</div>
                <div class="tab" data-target="tab-arms-prepaid">Prepaid</div>
            </div>

            <!-- TAB CONTENTS -->
            <div id="tab-smart" class="tab-content"></div>
            <div id="tab-arms" class="tab-content"></div>
            <div id="tab-arms-prepaid" class="tab-content"></div>
        </div>
    </div>

    <!-- BATCH PROCESS MODE -->
    <div id="modeBatch" class="hidden">
        <label style="font-size: 13px; font-weight: 600; margin-bottom: 6px; display:block;">Paste Consumer Numbers (One per line)</label>
        <textarea id="batchInput" class="styled-input" placeholder="72136&#10;54321&#10;98765"></textarea>
        <button id="batchProcessBtn" class="btn-primary btn-success" disabled>Process & Export Excel</button>
    </div>

    <div id="statusMessage" class="status-badge" style="margin-top: 15px;">⏳ Loading databases...</div>
</div>

<script>
    // ==========================================
    // 1. UI LOGIC (Tabs & Modes)
    // ==========================================
    const btnSingle = document.getElementById('btnSingleMode');
    const btnBatch = document.getElementById('btnBatchMode');
    const modeSingle = document.getElementById('modeSingle');
    const modeBatch = document.getElementById('modeBatch');

    btnSingle.addEventListener('click', () => {
        btnSingle.classList.add('active');
        btnBatch.classList.remove('active');
        modeSingle.classList.remove('hidden');
        modeBatch.classList.add('hidden');
    });

    btnBatch.addEventListener('click', () => {
        btnBatch.classList.add('active');
        btnSingle.classList.remove('active');
        modeBatch.classList.remove('hidden');
        modeSingle.classList.add('hidden');
    });

    const tabs = document.querySelectorAll('.tab');
    const tabContents = document.querySelectorAll('.tab-content');
    
    // Restore saved tab
    const savedTab = localStorage.getItem('gesd_active_tab') || 'tab-smart';
    document.querySelector(`[data-target="${savedTab}"]`).classList.add('active');
    document.getElementById(savedTab).classList.add('active');

    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            tabs.forEach(t => t.classList.remove('active'));
            tabContents.forEach(c => c.classList.remove('active'));
            
            tab.classList.add('active');
            const targetId = tab.getAttribute('data-target');
            document.getElementById(targetId).classList.add('active');
            
            localStorage.setItem('gesd_active_tab', targetId);
        });
    });

    // ==========================================
    // 2. DATABASES & LOGIN
    // ==========================================
    let consumerDatabase = {};
    let dtrDatabase = [];

    async function loadDatabases() {
        try {
            const consRes = await fetch('data.json');
            const consData = await consRes.json();
            consData.forEach(row => {
                if (row.ConsumerNo) consumerDatabase[row.ConsumerNo.toString().trim()] = row;
            });

            const dtrRes = await fetch('dtr.json');
            dtrDatabase = await dtrRes.json();

            document.getElementById('statusMessage').textContent = "✅ Databases Ready";
            document.getElementById('statusMessage').style.color = "#059669";
            document.getElementById('statusMessage').style.background = "#ecfdf5";
            document.getElementById('searchBtn').disabled = false;
            document.getElementById('batchProcessBtn').disabled = false;
        } catch (error) {
            document.getElementById('statusMessage').textContent = "❌ Failed to load JSON";
            document.getElementById('statusMessage').style.color = "#dc2626";
            document.getElementById('statusMessage').style.background = "#fef2f2";
        }
    }

    const CORRECT_PASSWORD = "gesd2026"; 
    const loginScreen = document.getElementById('loginScreen');
    const mainApp = document.getElementById('mainApp');
    const passInput = document.getElementById('passInput');

    if (localStorage.getItem('gesd_tracker_unlocked') === 'true') {
        loginScreen.style.display = 'none';
        mainApp.style.display = 'block';
        loadDatabases(); 
    }

    document.getElementById('loginBtn').addEventListener('click', function() {
        if (passInput.value === CORRECT_PASSWORD) {
            localStorage.setItem('gesd_tracker_unlocked', 'true');
            loginScreen.style.display = 'none';
            mainApp.style.display = 'block';
            loadDatabases(); 
        } else {
            document.getElementById('loginError').style.display = 'block';
        }
    });

    document.getElementById('logoutBtn').addEventListener('click', function() {
        localStorage.removeItem('gesd_tracker_unlocked');
        mainApp.style.display = 'none';
        loginScreen.style.display = 'block';
    });

    // ==========================================
    // 3. MATH ENGINE
    // ==========================================
    function haversine(lat1, lon1, lat2, lon2) {
        const R = 6371000; 
        const toRad = Math.PI / 180;
        const dLat = (lat2 - lat1) * toRad;
        const dLon = (lon2 - lon1) * toRad;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * toRad) * Math.cos(lat2 * toRad) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function getNearestDTRs(targetLat, targetLon, maxCount = 3) {
        let distances = dtrDatabase.map(dtr => {
            let dLat = parseFloat(dtr.Latitude);
            let dLon = parseFloat(dtr.Longitude);
            if (isNaN(dLat) || isNaN(dLon)) return null;
            
            let numCap = parseInt((dtr.Capacity || "0").replace(/\D/g, '')) || 0;
            let numCons = parseInt(dtr["Consumer Count"]) || 0;
            let isOver = (numCap > 0 && numCons > numCap);

            return {
                dtrNo: dtr["DTR No"] || "N/A",
                name: dtr["DTR Name"] || "Unknown",
                capacity: dtr.Capacity || "0",
                feeder: (dtr["Feeder Name"] || "N/A").trim(),
                consumers: numCons,
                loadStatus: isOver ? "⚠️ Overloaded" : "✅ Optimal",
                loadColor: isOver ? "#dc2626" : "#059669",
                dist: haversine(targetLat, targetLon, dLat, dLon)
            };
        }).filter(item => item !== null);
        distances.sort((a, b) => a.dist - b.dist);
        return distances.slice(0, maxCount);
    }

    function isValidCoordinate(lat, long) {
        if (lat == null || long == null) return false;
        let strLat = lat.toString().trim().toLowerCase();
        let strLong = long.toString().trim().toLowerCase();
        if (["", "0", "0.0", "nil", "null", "n/a"].includes(strLat)) return false;
        return !isNaN(parseFloat(strLat)) && !isNaN(parseFloat(strLong)) && parseFloat(strLat) !== 0;
    }

    // ==========================================
    // 4. SINGLE SEARCH ENGINE
    // ==========================================
    function renderBlock(title, lat, long, cssClass) {
        if (!isValidCoordinate(lat, long)) {
            return `<div class="badge-missing">✕ No location data available for this meter type.</div>`;
        }
        let nearest = getNearestDTRs(parseFloat(lat), parseFloat(long), 3);
        let dtrHtml = nearest.map((dtr, i) => `
            <div class="dtr-item">
                <div class="dtr-main-row">
                    <div class="dtr-name">${i + 1}. ${dtr.name}</div>
                    <div class="dtr-dist">${dtr.dist.toFixed(1)}m</div>
                </div>
                <div class="dtr-details">
                    <div><span class="label">DTR No:</span> ${dtr.dtrNo} &nbsp;|&nbsp; <span class="label">Cap:</span> ${dtr.capacity}</div>
                    <div><span class="label">Feeder:</span> ${dtr.feeder}</div>
                </div>
                <div class="dtr-footer">
                    <div><span class="label">Consumers:</span> <span class="consumer-val">${dtr.consumers}</span></div>
                    <div style="color: ${dtr.loadColor}; font-weight: 700; font-size: 13px;">${dtr.loadStatus}</div>
                </div>
            </div>
        `).join('');

        return `
            <div class="location-group">
                <a href="https://www.google.com/maps?q=${lat},${long}" target="_blank" class="map-card ${cssClass}">
                    <span>📍 ${title}</span><span>Open Map ↗</span>
                </a>
                <div class="dtr-list">
                    <div class="dtr-header">Nearest DTRs (Approximate):</div>
                    ${dtrHtml}
                </div>
            </div>`;
    }

    document.getElementById('searchBtn').addEventListener('click', function() {
        let inputVal = document.getElementById('shortInput').value.trim();
        if (!inputVal) return;
        let last5 = inputVal.slice(-5).padStart(5, '0');
        let fullNo = (parseInt(last5.charAt(0)) >= 7 ? "0400100" : "0400000") + last5;

        document.getElementById('displayFullNumber').textContent = fullNo;
        document.getElementById('resultsArea').style.display = "block";

        let result = consumerDatabase[fullNo];
        if (result) {
            document.getElementById('tab-smart').innerHTML = renderBlock("Smart Meter", result.SmartLat, result.SmartLong, "card-smart");
            document.getElementById('tab-arms').innerHTML = renderBlock("ARMS Postpaid", result.ArmsLat, result.ArmsLong, "card-arms");
            document.getElementById('tab-arms-prepaid').innerHTML = renderBlock("Prepaid Meter", result.PrepaidLat, result.PrepaidLong, "card-prepaid");
        } else {
            let err = `<div class="error-card">No consumer record found for ${fullNo}</div>`;
            document.getElementById('tab-smart').innerHTML = err;
            document.getElementById('tab-arms').innerHTML = err;
            document.getElementById('tab-arms-prepaid').innerHTML = err;
        }
    });

    // ==========================================
    // 5. BATCH EXPORT ENGINE
    // ==========================================
    document.getElementById('batchProcessBtn').addEventListener('click', () => {
        let rawInput = document.getElementById('batchInput').value;
        // Split by lines or commas
        let numbers = rawInput.split(/[\n,]+/).map(n => n.trim()).filter(n => n !== "");
        if (numbers.length === 0) return alert("Please enter consumer numbers.");

        let csv = "Consumer_No,Source_Found,Latitude,Longitude,Nearest_DTR_Name,DTR_Capacity,Distance_Meters,Load_Status\n";

        numbers.forEach(num => {
            let last5 = num.slice(-5).padStart(5, '0');
            let fullNo = (parseInt(last5.charAt(0)) >= 7 ? "0400100" : "0400000") + last5;
            let row = consumerDatabase[fullNo];

            if (!row) {
                csv += `${fullNo},Not Found In DB,,,,,,\n`;
                return;
            }

            // Find best coordinate priority
            let bestLat = null, bestLon = null, source = "";
            if (isValidCoordinate(row.SmartLat, row.SmartLong)) { bestLat = row.SmartLat; bestLon = row.SmartLong; source = "Smart"; }
            else if (isValidCoordinate(row.ArmsLat, row.ArmsLong)) { bestLat = row.ArmsLat; bestLon = row.ArmsLong; source = "ARMS"; }
            else if (isValidCoordinate(row.PrepaidLat, row.PrepaidLong)) { bestLat = row.PrepaidLat; bestLon = row.PrepaidLong; source = "Prepaid"; }

            if (bestLat === null) {
                csv += `${fullNo},No Coordinates Found,,,,,,\n`;
                return;
            }

            let nearest = getNearestDTRs(parseFloat(bestLat), parseFloat(bestLon), 1)[0];
            if (nearest) {
                csv += `${fullNo},${source},${bestLat},${bestLon},"${nearest.name}",${nearest.capacity},${nearest.dist.toFixed(1)},${nearest.loadStatus}\n`;
            } else {
                csv += `${fullNo},${source},${bestLat},${bestLon},No DTRs In Range,,,\n`;
            }
        });

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `Batch_DTR_Export_${new Date().getTime()}.csv`;
        link.style.display = "none";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });

</script>
</body>
</html>
