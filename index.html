<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location & DTR Tracker - GESD</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary: #0f4c81;
            --primary-hover: #083358;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 12px; }

        .hidden { display: none !important; }

        /* Install Banner */
        #installAppBtn { width: 100%; max-width: 480px; padding: 14px; background-color: #10b981; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 15px; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }

        .app-card { background: var(--card-bg); width: 100%; max-width: 480px; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); padding: 28px 24px; border: 1px solid #f1f5f9; position: relative; }
        
        .brand-header { text-align: center; margin-bottom: 20px; }
        .brand-logo { height: 60px; width: auto; object-fit: contain; margin-bottom: 10px; }
        .brand-header h1 { font-size: 20px; font-weight: 700; color: var(--primary); }
        .brand-header p { font-size: 13px; color: var(--text-muted); font-weight: 500; }

        /* Mode Switcher */
        .mode-toggle { display: flex; background: #f1f5f9; border-radius: 12px; margin-bottom: 20px; padding: 4px; }
        .mode-btn { flex: 1; padding: 10px; text-align: center; font-size: 13px; font-weight: 700; cursor: pointer; color: #64748b; border-radius: 8px; transition: 0.2s; }
        .mode-btn.active { background: var(--primary); color: white; box-shadow: 0 2px 8px rgba(15, 76, 129, 0.2); }

        /* Inputs */
        .styled-input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1.5px solid #e2e8f0; font-size: 16px; outline: none; transition: all 0.2s ease; background: #fafafa; margin-bottom: 12px; }
        .styled-input:focus { border-color: var(--primary); background: #ffffff; box-shadow: 0 0 0 4px rgba(15, 76, 129, 0.1); }
        textarea.styled-input { resize: vertical; min-height: 100px; font-family: monospace; font-size: 14px; }
        
        .btn-primary { width: 100%; padding: 14px; border-radius: 12px; border: none; background-color: var(--primary); color: white; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(15, 76, 129, 0.25); }
        .btn-primary:hover:not(:disabled) { background-color: var(--primary-hover); }
        .btn-primary:disabled { background-color: #cbd5e1; cursor: not-allowed; box-shadow: none; }
        .btn-success { background-color: #10b981; }
        .btn-secondary { background-color: #64748b; }

        .status-badge { text-align: center; font-size: 12px; font-weight: 600; color: var(--text-muted); padding: 6px 12px; border-radius: 20px; background: #f1f5f9; width: fit-content; margin: 0 auto; }
        
        .results-section { margin-top: 20px; display: none; }
        .consumer-chip { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; font-family: monospace; font-size: 16px; font-weight: 700; text-align: center; padding: 10px; border-radius: 10px; margin-bottom: 16px; }
        
        /* TABS UI */
        .tabs-container { display: flex; border-bottom: 2px solid #e2e8f0; margin-bottom: 16px; }
        .tab { flex: 1; text-align: center; padding: 10px 5px; font-size: 13px; font-weight: 700; color: #94a3b8; cursor: pointer; border-bottom: 3px solid transparent; transition: 0.2s; }
        .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Map Links Grid */
        .links-grid { display: flex; flex-direction: column; gap: 12px; }
        .map-card { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-radius: 12px; text-decoration: none; color: white; font-size: 14px; font-weight: 600; }
        .card-smart { background: linear-gradient(135deg, #10b981, #059669); }
        .card-arms { background: linear-gradient(135deg, #0284c7, #0369a1); }
        .card-prepaid { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }

        /* DTR Cards & Headers */
        .dtr-section-title { 
            font-size: 13px; font-weight: 700; color: #ffffff; background: var(--primary);
            padding: 10px 14px; border-radius: 10px 10px 0 0; margin: 16px 0 0 0;
            text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px;
        }
        .dtr-block { 
            border: 1px solid #e2e8f0; border-top: none; border-radius: 0 0 10px 10px;
            padding: 12px 14px; background: #fafafa; margin-bottom: 16px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        
        .dtr-item { padding: 10px 0; border-bottom: 1px dashed #cbd5e1; }
        .dtr-item:last-child { border-bottom: none; padding-bottom: 0; }
        .dtr-main-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .dtr-name { font-weight: 700; color: #1e293b; font-size: 14px; }
        .dtr-dist { font-weight: 700; color: #ef4444; font-family: monospace; font-size: 13px; background: #fee2e2; padding: 2px 6px; border-radius: 6px; }
        .dtr-details { font-size: 12px; color: #475569; line-height: 1.5; }
        .dtr-details span.label { font-weight: 600; color: #1e293b; }
        .dtr-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 12px; }
        .consumer-val { font-weight: 700; color: #1e293b; }

        /* Batch Results Preview */
        .batch-output-box { background: #1e293b; color: #38bdf8; padding: 12px; border-radius: 10px; font-family: monospace; font-size: 12px; max-height: 180px; overflow-y: auto; white-space: pre; margin-top: 12px; display: none; }
        .batch-actions { display: flex; gap: 10px; margin-top: 12px; }

        .badge-missing { background: #f1f5f9; color: #94a3b8; font-size: 13px; padding: 14px; border-radius: 12px; text-align: center; border: 1px dashed #cbd5e1; font-weight: 500; }
        .error-card { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 14px; border-radius: 12px; text-align: center; font-size: 14px; font-weight: 600; }

        #loginError { color: #dc2626; font-size: 13px; text-align: center; margin-top: 10px; display: none; font-weight: 600; }
        #mainApp { display: none; }
    </style>
</head>
<body>

<button id="installAppBtn" class="hidden">📲 Install App to Home Screen</button>

<!-- LOGIN SCREEN -->
<div class="app-card" id="loginScreen">
    <div class="brand-header">
        <img src="logo.png" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
        <h1>Authorized Access</h1>
        <p>Goalpara ESD Location Tracker</p>
    </div>
    <input type="password" id="passInput" class="styled-input" placeholder="Enter Access PIN" autocomplete="off">
    <button id="loginBtn" class="btn-primary">Unlock App</button>
    <div id="loginError">❌ Incorrect PIN. Please try again.</div>
</div>

<!-- MAIN APP SCREEN -->
<div class="app-card" id="mainApp">
    <div class="brand-header">
        <img src="logo.png" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
        <h1>Location & DTR Tracker</h1>
        <button id="logoutBtn" style="background:none; border:none; color:var(--text-muted); text-decoration:underline; cursor:pointer; font-size:12px; margin-top:4px;">Lock App</button>
    </div>

    <!-- Mode Switcher -->
    <div class="mode-toggle">
        <div class="mode-btn active" id="btnSingleMode">Single Search</div>
        <div class="mode-btn" id="btnBatchMode">Batch Process</div>
    </div>

    <!-- SINGLE SEARCH MODE -->
    <div id="modeSingle">
        <div style="margin-bottom: 12px;">
            <label style="font-size: 13px; font-weight: 600; margin-bottom: 6px; display:block;">Consumer No. (Last 5 Digits)</label>
            <input type="number" id="shortInput" class="styled-input" placeholder="e.g. 72136" autocomplete="off">
            <button id="searchBtn" class="btn-primary" disabled>Search Location</button>
        </div>

        <div id="resultsArea" class="results-section">
            <div class="consumer-chip" id="displayFullNumber"></div>
            
            <div class="tabs-container">
                <div class="tab" data-target="tab-locations">📍 Meter Locations</div>
                <div class="tab" data-target="tab-dtrs">⚡ Nearest DTRs</div>
            </div>

            <!-- TAB 1: LOCATIONS -->
            <div id="tab-locations" class="tab-content"></div>

            <!-- TAB 2: NEAREST DTRS -->
            <div id="tab-dtrs" class="tab-content"></div>
        </div>
    </div>

    <!-- BATCH PROCESS MODE -->
    <div id="modeBatch" class="hidden">
        <label style="font-size: 13px; font-weight: 600; margin-bottom: 6px; display:block;">Paste Consumer Numbers (One per line)</label>
        <textarea id="batchInput" class="styled-input" placeholder="72136&#10;54321&#10;98765"></textarea>
        <button id="batchProcessBtn" class="btn-primary btn-success" disabled>⚡ Process Batch Data</button>

        <div id="batchResultsContainer" style="display: none;">
            <div class="batch-output-box" id="batchOutputPreview"></div>
            <div class="batch-actions">
                <button id="copyBatchBtn" class="btn-primary btn-secondary" style="flex: 1;">📋 Copy to Clipboard</button>
                <button id="downloadBatchBtn" class="btn-primary btn-success" style="flex: 1;">⬇ Download CSV</button>
            </div>
        </div>
    </div>

    <div id="statusMessage" class="status-badge" style="margin-top: 15px;">⏳ Loading databases...</div>
</div>

<script>
    // ==========================================
    // 1. UI MODE & TAB NAVIGATION
    // ==========================================
    const btnSingle = document.getElementById('btnSingleMode');
    const btnBatch = document.getElementById('btnBatchMode');
    const modeSingle = document.getElementById('modeSingle');
    const modeBatch = document.getElementById('modeBatch');

    btnSingle.addEventListener('click', () => {
        btnSingle.classList.add('active');
        btnBatch.classList.remove('active');
        modeSingle.classList.remove('hidden');
        modeBatch.classList.add('hidden');
    });

    btnBatch.addEventListener('click', () => {
        btnBatch.classList.add('active');
        btnSingle.classList.remove('active');
        modeBatch.classList.remove('hidden');
        modeSingle.classList.add('hidden');
    });

    // Tab Logic with Memory
    const tabs = document.querySelectorAll('.tab');
    const tabContents = document.querySelectorAll('.tab-content');
    
    const savedTab = localStorage.getItem('gesd_active_tab_v3') || 'tab-locations';
    const initialTab = document.querySelector(`[data-target="${savedTab}"]`) || tabs[0];
    initialTab.classList.add('active');
    document.getElementById(initialTab.getAttribute('data-target')).classList.add('active');

    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            tabs.forEach(t => t.classList.remove('active'));
            tabContents.forEach(c => c.classList.remove('active'));
            
            tab.classList.add('active');
            const targetId = tab.getAttribute('data-target');
            document.getElementById(targetId).classList.add('active');
            
            localStorage.setItem('gesd_active_tab_v3', targetId);
        });
    });

    // ==========================================
    // 2. DATABASES & LOGIN LOGIC
    // ==========================================
    let consumerDatabase = {};
    let dtrDatabase = [];

    async function loadDatabases() {
        try {
            const consRes = await fetch('data.json');
            const consData = await consRes.json();
            consData.forEach(row => {
                if (row.ConsumerNo) consumerDatabase[row.ConsumerNo.toString().trim()] = row;
            });

            const dtrRes = await fetch('dtr.json');
            dtrDatabase = await dtrRes.json();

            document.getElementById('statusMessage').textContent = "✅ Databases Ready";
            document.getElementById('statusMessage').style.color = "#059669";
            document.getElementById('statusMessage').style.background = "#ecfdf5";
            document.getElementById('searchBtn').disabled = false;
            document.getElementById('batchProcessBtn').disabled = false;
        } catch (error) {
            document.getElementById('statusMessage').textContent = "❌ Failed to load JSON";
            document.getElementById('statusMessage').style.color = "#dc2626";
            document.getElementById('statusMessage').style.background = "#fef2f2";
        }
    }

    const CORRECT_PASSWORD = "gesd2026"; 
    const loginScreen = document.getElementById('loginScreen');
    const mainApp = document.getElementById('mainApp');
    const passInput = document.getElementById('passInput');

    if (localStorage.getItem('gesd_tracker_unlocked') === 'true') {
        loginScreen.style.display = 'none';
        mainApp.style.display = 'block';
        loadDatabases(); 
    }

    document.getElementById('loginBtn').addEventListener('click', function() {
        if (passInput.value === CORRECT_PASSWORD) {
            localStorage.setItem('gesd_tracker_unlocked', 'true');
            loginScreen.style.display = 'none';
            mainApp.style.display = 'block';
            loadDatabases(); 
        } else {
            document.getElementById('loginError').style.display = 'block';
        }
    });

    document.getElementById('logoutBtn').addEventListener('click', function() {
        localStorage.removeItem('gesd_tracker_unlocked');
        mainApp.style.display = 'none';
        loginScreen.style.display = 'block';
    });

    // ==========================================
    // 3. HAVERSINE & CALCULATIONS
    // ==========================================
    function haversine(lat1, lon1, lat2, lon2) {
        const R = 6371000; 
        const toRad = Math.PI / 180;
        const dLat = (lat2 - lat1) * toRad;
        const dLon = (lon2 - lon1) * toRad;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * toRad) * Math.cos(lat2 * toRad) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function getNearestDTRs(targetLat, targetLon, maxCount = 3) {
        let distances = dtrDatabase.map(dtr => {
            let dLat = parseFloat(dtr.Latitude);
            let dLon = parseFloat(dtr.Longitude);
            if (isNaN(dLat) || isNaN(dLon)) return null;
            
            let numCap = parseInt((dtr.Capacity || "0").replace(/\D/g, '')) || 0;
            let numCons = parseInt(dtr["Consumer Count"]) || 0;
            let isOver = (numCap > 0 && numCons > numCap);

            return {
                dtrNo: dtr["DTR No"] || "N/A",
                name: dtr["DTR Name"] || "Unknown",
                capacity: dtr.Capacity || "0",
                feeder: (dtr["Feeder Name"] || "N/A").trim(),
                consumers: numCons,
                loadStatus: isOver ? "⚠️ Overloaded" : "✅ Optimal",
                loadColor: isOver ? "#dc2626" : "#059669",
                dist: haversine(targetLat, targetLon, dLat, dLon)
            };
        }).filter(item => item !== null);
        distances.sort((a, b) => a.dist - b.dist);
        return distances.slice(0, maxCount);
    }

    function isValidCoordinate(lat, long) {
        if (lat == null || long == null) return false;
        let strLat = lat.toString().trim().toLowerCase();
        let strLong = long.toString().trim().toLowerCase();
        if (["", "0", "0.0", "nil", "null", "n/a"].includes(strLat)) return false;
        return !isNaN(parseFloat(strLat)) && !isNaN(parseFloat(strLong)) && parseFloat(strLat) !== 0;
    }

    // ==========================================
    // 4. SINGLE SEARCH LOGIC
    // ==========================================
    document.getElementById('searchBtn').addEventListener('click', function() {
        let inputVal = document.getElementById('shortInput').value.trim();
        if (!inputVal) return;
        let last5 = inputVal.slice(-5).padStart(5, '0');
        let fullNo = (parseInt(last5.charAt(0)) >= 7 ? "0400100" : "0400000") + last5;

        document.getElementById('displayFullNumber').textContent = fullNo;
        document.getElementById('resultsArea').style.display = "block";

        let result = consumerDatabase[fullNo];
        const tabLocations = document.getElementById('tab-locations');
        const tabDtrs = document.getElementById('tab-dtrs');

        if (!result) {
            let err = `<div class="error-card">No consumer record found for ${fullNo}</div>`;
            tabLocations.innerHTML = err;
            tabDtrs.innerHTML = err;
            return;
        }

        // --- POPULATE TAB 1: LOCATIONS ---
        let mapLinksHtml = '<div class="links-grid">';
        if (isValidCoordinate(result.SmartLat, result.SmartLong)) {
            mapLinksHtml += `<a href="https://www.google.com/maps?q=${result.SmartLat},${result.SmartLong}" target="_blank" class="map-card card-smart"><span>📍 Smart Meter Location</span><span>Open ↗</span></a>`;
        } else {
            mapLinksHtml += `<div class="badge-missing">✕ Smart Meter: Not Available</div>`;
        }

        if (isValidCoordinate(result.ArmsLat, result.ArmsLong)) {
            mapLinksHtml += `<a href="https://www.google.com/maps?q=${result.ArmsLat},${result.ArmsLong}" target="_blank" class="map-card card-arms"><span>📍 ARMS Postpaid Location</span><span>Open ↗</span></a>`;
        } else {
            mapLinksHtml += `<div class="badge-missing">✕ ARMS Postpaid: Not Available</div>`;
        }

        if (isValidCoordinate(result.PrepaidLat, result.PrepaidLong)) {
            mapLinksHtml += `<a href="https://www.google.com/maps?q=${result.PrepaidLat},${result.PrepaidLong}" target="_blank" class="map-card card-prepaid"><span>📍 Prepaid Meter Location</span><span>Open ↗</span></a>`;
        } else {
            mapLinksHtml += `<div class="badge-missing">✕ Prepaid Meter: Not Available</div>`;
        }
        mapLinksHtml += '</div>';
        tabLocations.innerHTML = mapLinksHtml;

        // --- POPULATE TAB 2: NEAREST DTRS ---
        let dtrHtml = '';
        
        function buildDtrBlock(typeLabel, lat, lon) {
            if (!isValidCoordinate(lat, lon)) return '';
            let nearest = getNearestDTRs(parseFloat(lat), parseFloat(lon), 3);
            let items = nearest.map((dtr, i) => `
                <div class="dtr-item">
                    <div class="dtr-main-row">
                        <div class="dtr-name">${i + 1}. ${dtr.name}</div>
                        <div class="dtr-dist">${dtr.dist.toFixed(1)}m</div>
                    </div>
                    <div class="dtr-details">
                        <div><span class="label">DTR No:</span> ${dtr.dtrNo} &nbsp;|&nbsp; <span class="label">Cap:</span> ${dtr.capacity}</div>
                        <div><span class="label">Feeder:</span> ${dtr.feeder}</div>
                    </div>
                    <div class="dtr-footer">
                        <div><span class="label">Consumers (11/08/2026):</span> <span class="consumer-val">${dtr.consumers}</span></div>
                        <div style="color: ${dtr.loadColor}; font-weight: 700;">${dtr.loadStatus}</div>
                    </div>
                </div>
            `).join('');

            let icon = typeLabel.includes("Smart") ? "🟢" : typeLabel.includes("ARMS") ? "🔵" : "🟣";

            return `
                <div class="dtr-section-title">${icon} Based on ${typeLabel}</div>
                <div class="dtr-block">${items}</div>
            `;
        }

        dtrHtml += buildDtrBlock("Smart Meter", result.SmartLat, result.SmartLong);
        dtrHtml += buildDtrBlock("ARMS Postpaid", result.ArmsLat, result.ArmsLong);
        dtrHtml += buildDtrBlock("Prepaid Meter", result.PrepaidLat, result.PrepaidLong);

        if (dtrHtml === '') {
            tabDtrs.innerHTML = `<div class="badge-missing">✕ Cannot calculate nearest DTRs without valid consumer coordinates.</div>`;
        } else {
            tabDtrs.innerHTML = dtrHtml;
        }
    });

    document.getElementById('shortInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') document.getElementById('searchBtn').click();
    });

    // ==========================================
    // 5. BATCH PROCESSING & EXPORT W/ ALL COORDS
    // ==========================================
    let generatedBatchCSV = "";
    let generatedBatchTSV = ""; 

    function getBatchDataString(lat, lon, isCsv = true) {
        let sep = isCsv ? "," : "\t";
        if (!isValidCoordinate(lat, lon)) {
            return `N/A${sep}N/A${sep}N/A${sep}N/A${sep}N/A${sep}N/A`;
        }
        let nearest = getNearestDTRs(parseFloat(lat), parseFloat(lon), 1)[0];
        if (nearest) {
            let name = isCsv ? `"${nearest.name}"` : nearest.name;
            return `${lat}${sep}${lon}${sep}${nearest.dtrNo}${sep}${name}${sep}${nearest.dist.toFixed(1)}${sep}${nearest.loadStatus}`;
        }
        return `${lat}${sep}${lon}${sep}No DTRs${sep}No DTRs${sep}N/A${sep}N/A`;
    }

    document.getElementById('batchProcessBtn').addEventListener('click', () => {
        let rawInput = document.getElementById('batchInput').value;
        let numbers = rawInput.split(/[\n,]+/).map(n => n.trim()).filter(n => n !== "");
        if (numbers.length === 0) return alert("Please paste consumer numbers first.");

        // New Headers for ALL THREE coordinate types side-by-side
        let csvHeaders = [
            "Consumer_No", 
            "Smart_Lat", "Smart_Lon", "Smart_DTR_No", "Smart_DTR_Name", "Smart_Dist(m)", "Smart_Load",
            "ARMS_Lat", "ARMS_Lon", "ARMS_DTR_No", "ARMS_DTR_Name", "ARMS_Dist(m)", "ARMS_Load",
            "Prepaid_Lat", "Prepaid_Lon", "Prepaid_DTR_No", "Prepaid_DTR_Name", "Prepaid_Dist(m)", "Prepaid_Load"
        ];
        
        let tsvHeaders = [
            "Consumer No", 
            "Smart Lat", "Smart Lon", "Smart DTR No", "Smart DTR Name", "Smart Dist(m)", "Smart Load",
            "ARMS Lat", "ARMS Lon", "ARMS DTR No", "ARMS DTR Name", "ARMS Dist(m)", "ARMS Load",
            "Prepaid Lat", "Prepaid Lon", "Prepaid DTR No", "Prepaid DTR Name", "Prepaid Dist(m)", "Prepaid Load"
        ];

        generatedBatchCSV = csvHeaders.join(",") + "\n";
        generatedBatchTSV = tsvHeaders.join("\t") + "\n";

        let previewText = `Processed ${numbers.length} records. Ready for export.\n\nRESULTS PREVIEW:\n-----------------------------------------\n`;

        numbers.forEach(num => {
            let last5 = num.slice(-5).padStart(5, '0');
            let fullNo = (parseInt(last5.charAt(0)) >= 7 ? "0400100" : "0400000") + last5;
            let row = consumerDatabase[fullNo];

            if (!row) {
                // 18 empty separators after Consumer No
                generatedBatchCSV += `${fullNo},,,,,,,,,,,,,,,,,,\n`;
                generatedBatchTSV += `${fullNo}\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\n`;
                previewText += `${fullNo} -> ❌ Not Found in DB\n`;
                return;
            }

            // Generate string blocks for each coordinate type
            let smartCSV = getBatchDataString(row.SmartLat, row.SmartLong, true);
            let armsCSV = getBatchDataString(row.ArmsLat, row.ArmsLong, true);
            let prepCSV = getBatchDataString(row.PrepaidLat, row.PrepaidLong, true);

            let smartTSV = getBatchDataString(row.SmartLat, row.SmartLong, false);
            let armsTSV = getBatchDataString(row.ArmsLat, row.ArmsLong, false);
            let prepTSV = getBatchDataString(row.PrepaidLat, row.PrepaidLong, false);

            generatedBatchCSV += `${fullNo},${smartCSV},${armsCSV},${prepCSV}\n`;
            generatedBatchTSV += `${fullNo}\t${smartTSV}\t${armsTSV}\t${prepTSV}\n`;
            previewText += `${fullNo} -> Analyzed successfully\n`;
        });

        document.getElementById('batchOutputPreview').textContent = previewText;
        document.getElementById('batchResultsContainer').style.display = 'block';
    });

    // DIRECT COPY TO CLIPBOARD
    document.getElementById('copyBatchBtn').addEventListener('click', () => {
        if (!generatedBatchTSV) return;
        navigator.clipboard.writeText(generatedBatchTSV).then(() => {
            const btn = document.getElementById('copyBatchBtn');
            btn.textContent = "✅ Copied to Clipboard!";
            setTimeout(() => btn.textContent = "📋 Copy to Clipboard", 2000);
        }).catch(err => {
            alert("Copy failed. Please use the Download CSV option.");
        });
    });

    // DOWNLOAD CSV EXCEL FILE
    document.getElementById('downloadBatchBtn').addEventListener('click', () => {
        if (!generatedBatchCSV) return;
        const blob = new Blob([generatedBatchCSV], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `GESD_Detailed_Batch_DTR_${new Date().getTime()}.csv`;
        link.style.display = "none";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });

    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }
</script>
</body>
</html>
