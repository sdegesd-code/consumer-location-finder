<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location & DTR Tracker - GESD</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary: #0f4c81;
            --primary-hover: #083358;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 12px; }

        .hidden { display: none !important; }

        /* Install Banner */
        #installAppBtn {
            width: 100%; max-width: 480px; padding: 14px; background-color: #10b981; color: white;
            border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer;
            margin-bottom: 15px; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .app-card { background: var(--card-bg); width: 100%; max-width: 480px; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); padding: 28px 24px; border: 1px solid #f1f5f9; }
        
        .brand-header { text-align: center; margin-bottom: 24px; }
        .brand-logo { height: 65px; width: auto; object-fit: contain; margin-bottom: 12px; }
        .brand-header h1 { font-size: 20px; font-weight: 700; color: var(--primary); }
        .brand-header p { font-size: 13px; color: var(--text-muted); font-weight: 500; }

        .styled-input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1.5px solid #e2e8f0; font-size: 16px; outline: none; transition: all 0.2s ease; background: #fafafa; margin-bottom: 12px; }
        .styled-input:focus { border-color: var(--primary); background: #ffffff; box-shadow: 0 0 0 4px rgba(15, 76, 129, 0.1); }
        
        .btn-primary { width: 100%; padding: 14px; border-radius: 12px; border: none; background-color: var(--primary); color: white; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(15, 76, 129, 0.25); }
        .btn-primary:hover:not(:disabled) { background-color: var(--primary-hover); }
        .btn-primary:disabled { background-color: #cbd5e1; cursor: not-allowed; box-shadow: none; }

        .status-badge { text-align: center; font-size: 12px; font-weight: 600; color: var(--text-muted); padding: 6px 12px; border-radius: 20px; background: #f1f5f9; width: fit-content; margin: 0 auto; }
        
        .results-section { margin-top: 24px; display: none; }
        .consumer-chip { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; font-family: monospace; font-size: 16px; font-weight: 700; text-align: center; padding: 10px; border-radius: 10px; margin-bottom: 18px; }
        
        /* New DTR Card Layout */
        .links-grid { display: flex; flex-direction: column; gap: 16px; }
        .location-group { border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; background: #fafafa; }
        .map-card { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; text-decoration: none; color: white; font-size: 14px; font-weight: 600; }
        
        .card-smart { background: linear-gradient(135deg, #10b981, #059669); }
        .card-arms { background: linear-gradient(135deg, #0284c7, #0369a1); }
        .card-prepaid { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
        
        .dtr-list { padding: 12px 16px; }
        .dtr-header { font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
        .dtr-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed #e2e8f0; font-size: 13px; }
        .dtr-item:last-child { border-bottom: none; }
        .dtr-name { font-weight: 600; color: #1e293b; }
        .dtr-cap { color: #64748b; font-size: 11px; background: #e2e8f0; padding: 2px 6px; border-radius: 4px; margin-left: 6px; }
        .dtr-dist { font-weight: 700; color: #ef4444; font-family: monospace; font-size: 14px; }

        .badge-missing { background: #f1f5f9; color: #94a3b8; font-size: 13px; padding: 12px; border-radius: 12px; text-align: center; border: 1px dashed #cbd5e1; }
        .error-card { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 14px; border-radius: 12px; text-align: center; font-size: 14px; font-weight: 600; }

        #loginError { color: #dc2626; font-size: 13px; text-align: center; margin-top: 10px; display: none; font-weight: 600; }
        #mainApp { display: none; }
    </style>
</head>
<body>

<button id="installAppBtn" class="hidden">📲 Install App to Home Screen</button>

<!-- LOGIN SCREEN -->
<div class="app-card" id="loginScreen">
    <div class="brand-header">
        <img src="logo.png" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
        <h1>Authorized Access</h1>
        <p>Goalpara ESD Location Tracker</p>
    </div>
    
    <input type="password" id="passInput" class="styled-input" placeholder="Enter Access PIN" autocomplete="off">
    <button id="loginBtn" class="btn-primary">Unlock App</button>
    <div id="loginError">❌ Incorrect PIN. Please try again.</div>
</div>

<!-- MAIN APP SCREEN -->
<div class="app-card" id="mainApp">
    <div class="brand-header">
        <img src="logo.png" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
        <h1>Location & DTR Tracker</h1>
        <button id="logoutBtn" style="background:none; border:none; color:var(--text-muted); text-decoration:underline; cursor:pointer; font-size:12px; margin-top:5px;">Lock App</button>
    </div>

    <div style="margin-bottom: 16px;">
        <label for="shortInput" style="font-size: 13px; font-weight: 600; margin-bottom: 6px; display:block;">Consumer No. (Last 5 Digits)</label>
        <input type="number" id="shortInput" class="styled-input" placeholder="e.g. 72136" autocomplete="off">
        <button id="searchBtn" class="btn-primary" disabled>Search Location</button>
    </div>

    <div id="statusMessage" class="status-badge">⏳ Loading databases...</div>

    <div id="resultsArea" class="results-section">
        <div class="consumer-chip" id="displayFullNumber"></div>
        <div id="linksContainer" class="links-grid"></div>
    </div>
</div>

<script>
    // ==========================================
    // 1. PWA INSTALLATION LOGIC (Preserved)
    // ==========================================
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }

    let deferredPrompt;
    const installBtn = document.getElementById('installAppBtn');
    const hasInstalled = localStorage.getItem('gesd_tracker_installed_v9'); // Bumped to v9

    if (!hasInstalled) {
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('hidden');
        });

        installBtn.addEventListener('click', async () => {
            installBtn.classList.add('hidden');
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                localStorage.setItem('gesd_tracker_installed_v9', 'true');
            }
            deferredPrompt = null;
        });

        window.addEventListener('appinstalled', () => {
            localStorage.setItem('gesd_tracker_installed_v9', 'true');
            installBtn.classList.add('hidden');
        });
    }

    // ==========================================
    // 2. SECURITY & LOGIN LOGIC (Preserved)
    // ==========================================
    const CORRECT_PASSWORD = "gesd2026"; 
    const loginScreen = document.getElementById('loginScreen');
    const mainApp = document.getElementById('mainApp');
    const passInput = document.getElementById('passInput');

    if (localStorage.getItem('gesd_tracker_unlocked') === 'true') {
        loginScreen.style.display = 'none';
        mainApp.style.display = 'block';
        loadDatabases(); 
    }

    document.getElementById('loginBtn').addEventListener('click', function() {
        if (passInput.value === CORRECT_PASSWORD) {
            localStorage.setItem('gesd_tracker_unlocked', 'true');
            loginScreen.style.display = 'none';
            mainApp.style.display = 'block';
            document.getElementById('loginError').style.display = 'none';
            loadDatabases(); 
        } else {
            document.getElementById('loginError').style.display = 'block';
            passInput.value = ""; 
        }
    });

    passInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') document.getElementById('loginBtn').click();
    });

    document.getElementById('logoutBtn').addEventListener('click', function() {
        localStorage.removeItem('gesd_tracker_unlocked');
        mainApp.style.display = 'none';
        loginScreen.style.display = 'block';
        passInput.value = "";
    });

    // ==========================================
    // 3. DATABASE LOADING (Consumers + DTRs)
    // ==========================================
    let consumerDatabase = {};
    let dtrDatabase = [];

    async function loadDatabases() {
        try {
            // Load Consumers
            const consRes = await fetch('data.json');
            const consData = await consRes.json();
            consData.forEach(row => {
                if (row.ConsumerNo) {
                    consumerDatabase[row.ConsumerNo.toString().trim()] = row;
                }
            });

            // Load DTRs
            const dtrRes = await fetch('dtr.json');
            dtrDatabase = await dtrRes.json();

            const status = document.getElementById('statusMessage');
            status.textContent = "✅ Databases Ready";
            status.style.color = "#059669";
            status.style.background = "#ecfdf5";
            document.getElementById('searchBtn').disabled = false;

        } catch (error) {
            const status = document.getElementById('statusMessage');
            status.textContent = "❌ Failed to load JSON databases";
            status.style.color = "#dc2626";
            status.style.background = "#fef2f2";
        }
    }

    // ==========================================
    // 4. HAVERSINE & SPATIAL MATH
    // ==========================================
    function haversine(lat1, lon1, lat2, lon2) {
        const R = 6371000; // Earth radius in meters
        const toRad = Math.PI / 180;
        const dLat = (lat2 - lat1) * toRad;
        const dLon = (lon2 - lon1) * toRad;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * toRad) * Math.cos(lat2 * toRad) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    function getNearestDTRs(targetLat, targetLon, maxCount = 3) {
        let distances = dtrDatabase.map(dtr => {
            let dLat = parseFloat(dtr.Latitude);
            let dLon = parseFloat(dtr.Longitude);
            if (isNaN(dLat) || isNaN(dLon)) return null;
            
            let dist = haversine(targetLat, targetLon, dLat, dLon);
            return {
                name: dtr["DTR Name"] || dtr.DTR_Name || "Unknown DTR",
                capacity: dtr.Capacity || "N/A",
                dist: dist
            };
        }).filter(item => item !== null);

        // Sort closest to furthest
        distances.sort((a, b) => a.dist - b.dist);
        
        // Return top 3
        return distances.slice(0, maxCount);
    }

    // ==========================================
    // 5. RENDER LOGIC
    // ==========================================
    function isValidCoordinate(lat, long) {
        if (lat == null || long == null) return false;
        let strLat = lat.toString().trim().toLowerCase();
        let strLong = long.toString().trim().toLowerCase();
        if (["", "0", "0.0", "nil", "null", "n/a"].includes(strLat)) return false;
        let numLat = parseFloat(strLat);
        let numLong = parseFloat(strLong);
        return !isNaN(numLat) && !isNaN(numLong) && numLat !== 0 && numLong !== 0;
    }

    function renderLocationBlock(title, lat, long, cssClass) {
        if (!isValidCoordinate(lat, long)) return '';

        let targetLat = parseFloat(lat);
        let targetLon = parseFloat(long);
        
        // Calculate nearest DTRs for this specific coordinate
        let nearestDTRs = getNearestDTRs(targetLat, targetLon, 3);
        
        // Build the HTML list of DTRs
        let dtrHtml = nearestDTRs.map((dtr, index) => `
            <div class="dtr-item">
                <div>
                    <span style="color:#94a3b8; margin-right:4px;">${index + 1}.</span>
                    <span class="dtr-name">${dtr.name}</span>
                    <span class="dtr-cap">${dtr.capacity}</span>
                </div>
                <div class="dtr-dist">${dtr.dist.toFixed(1)}m</div>
            </div>
        `).join('');

        // Return the full block (Map Button + DTR List)
        return `
            <div class="location-group">
                <a href="https://www.google.com/maps?q=${targetLat},${targetLon}" target="_blank" class="map-card ${cssClass}">
                    <span>📍 ${title}</span>
                    <span>Open Map ↗</span>
                </a>
                <div class="dtr-list">
                    <div class="dtr-header">Nearest DTRs (Approximate):</div>
                    ${dtrHtml}
                </div>
            </div>
        `;
    }

    document.getElementById('searchBtn').addEventListener('click', function() {
        let inputVal = document.getElementById('shortInput').value.trim();
        if (!inputVal) return;

        let last5 = inputVal.slice(-5).padStart(5, '0');
        let prefix = parseInt(last5.charAt(0)) >= 7 ? "0400100" : "0400000";
        let fullConsumerNumber = prefix + last5;

        document.getElementById('displayFullNumber').textContent = fullConsumerNumber;
        document.getElementById('resultsArea').style.display = "block";

        let result = consumerDatabase[fullConsumerNumber];
        let container = document.getElementById('linksContainer');

        if (result) {
            // Generate blocks for any available coordinates
            let smartHtml = renderLocationBlock("Smart Meter Location", result.SmartLat, result.SmartLong, "card-smart");
            let armsHtml = renderLocationBlock("ARMS Postpaid Location", result.ArmsLat, result.ArmsLong, "card-arms");
            let prepaidHtml = renderLocationBlock("Prepaid Meter Location", result.PrepaidLat, result.PrepaidLong, "card-prepaid");
            
            let finalHtml = smartHtml + armsHtml + prepaidHtml;

            if (finalHtml === '') {
                container.innerHTML = `<div class="badge-missing">✕ No valid coordinates found for ${fullConsumerNumber}</div>`;
            } else {
                container.innerHTML = finalHtml;
            }
        } else {
            container.innerHTML = `<div class="error-card">No consumer record found for ${fullConsumerNumber}</div>`;
        }
    });

    document.getElementById('shortInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') document.getElementById('searchBtn').click();
    });
</script>
</body>
</html>
